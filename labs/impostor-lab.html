<!doctype html>
<html lang="en">
<head>

<title>Impostor Lab</title>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d21; font: 13px/1.4 system-ui, sans-serif; }
  canvas.main { display: block; position: fixed; left: 0; top: 0; }
  #info { position: fixed; left: 10px; bottom: 10px; max-width: 760px; padding: 8px 10px; border-radius: 6px;
          background: rgba(20, 24, 30, .8); color: #dfe4ea; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; z-index: 2; }
  #title { position: fixed; left: 10px; top: 10px; padding: 6px 10px; border-radius: 6px; background: rgba(20, 24, 30, .8);
           color: #e6e9ee; z-index: 2; }
  #title a { color: #9cc4ff; }
  #atlas { position: fixed; right: 340px; top: 8px; display: none; z-index: 2; background: #000; border: 1px solid #444; }
  #overlay { position: fixed; inset: 0; display: none; z-index: 5; background: rgba(0,0,0,.92); cursor: pointer; }
  #overlay img { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; image-rendering: pixelated; }
  #overlay div { position: absolute; left: 10px; top: 10px; color: #fff; font: 13px ui-monospace, monospace; }

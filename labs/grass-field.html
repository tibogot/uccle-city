<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8e9aa6; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  #info { position: fixed; left: 10px; bottom: 10px; max-width: 560px; padding: 8px 10px; border-radius: 6px;

  #title { position: fixed; left: 10px; top: 10px; padding: 6px 10px; border-radius: 6px; background: rgba(20, 24, 30, .78);
           color: #e6e9ee; max-width: calc(100vw - 370px); }
  #title a { color: #9cc4ff; }
  #title small { color: #b8c2cc; }
  .upanel textarea { width: 100%; box-sizing: border-box; height: 120px; margin-top: 4px; background: #2a3039; color: #e6e9ee;
    border: 1px solid #3a424d; border-radius: 4px; font: 11px/1.3 ui-monospace, monospace; resize: vertical; }
  .upanel input[type=color] { width: 100%; height: 20px; padding: 0; border: 1px solid #3a424d; border-radius: 4px; background: none; }
  .upanel .unote { color: #8f9aa6; font-size: 11px; padding: 2px 0 4px; white-space: normal; }
</style>

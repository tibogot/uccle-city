<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Lab</title>
<link rel="icon" href="../viewer/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8e9aa6; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  #info { position: fixed; left: 10px; bottom: 10px; max-width: 560px; padding: 8px 10px; border-radius: 6px;
          background: rgba(20, 24, 30, .78); color: #dfe4ea; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; z-index: 2; }
  #title { position: fixed; left: 10px; top: 10px; padding: 6px 10px; border-radius: 6px; background: rgba(20, 24, 30, .78);
           color: #e6e9ee; z-index: 2; }
  #title a { color: #9cc4ff; }
  .tlabel { position: fixed; z-index: 2; pointer-events: none; transform: translate(-50%, 0); padding: 4px 7px; border-radius: 5px;
            background: rgba(20, 24, 30, .8); color: #e6e9ee; font: 10.5px/1.3 ui-monospace, monospace; white-space: pre; text-align: center; }
  .tlabel b { color: #9cc4ff; }
  #mask { position: fixed; left: 10px; top: 48px; width: 256px; height: 256px; border-radius: 6px; z-index: 2; display: none;
          image-rendering: auto; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  #walkbar { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px; z-index: 2;
             background: rgba(20, 24, 30, .8); color: #ffd27a; font: 12px ui-monospace, monospace; display: none; white-space: pre; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
    "three/src/": "https://cdn.jsdelivr.net/npm/three@0.187.0/src/",
    "meshoptimizer/simplifier": "https://cdn.jsdelivr.net/npm/meshoptimizer@1.2.0/meshopt_simplifier.js"
  }
}
</script>
</head>
<body>
<div id="title"><b>Tree Lab</b> — the city's tree chain (LODs, morph, impostors, fades, shadows) and new species · <a href="./">all labs</a> · <a href="../viewer/index.html?view=stjob">trees in the city</a></div>
<div id="walkbar"></div>
<canvas id="mask" width="512" height="512"></canvas>
<div id="info">loading…</div>
<script type="module" src="./tree-lab.js"></script>
</body>
</html>

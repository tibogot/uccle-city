<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Lab</title>
<link rel="icon" href="../viewer/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d22; font: 13px/1.4 system-ui, sans-serif; color: #e6e9ee; }
  canvas { display: block; }
  /* the old lab (?old=1) */
  #info { position: fixed; left: 10px; bottom: 10px; max-width: 640px; padding: 8px 10px; border-radius: 6px;
          background: rgba(20, 24, 30, .78); color: #dfe4ea; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; z-index: 2; }
  #title { position: fixed; left: 10px; top: 10px; padding: 6px 10px; border-radius: 6px; background: rgba(20, 24, 30, .78);
           color: #e6e9ee; z-index: 2; }
  #title a { color: #9cc4ff; }
  #split { position: fixed; top: 46px; left: 0; right: 0; display: none; pointer-events: none; z-index: 2;
           color: #fff; font: 600 13px system-ui, sans-serif; text-shadow: 0 0 4px #000; }
  #split span { position: absolute; width: 33.3%; text-align: center; }
  #notes { position: fixed; left: 10px; top: 48px; width: 380px; max-height: calc(100vh - 260px); overflow-y: auto; padding: 8px 10px;
           border-radius: 6px; background: rgba(20, 24, 30, .8); color: #dfe4ea; font: 12px/1.4 system-ui, sans-serif; z-index: 2; display: none; }
  #notes h3 { margin: 6px 0 2px; font-size: 12px; color: #9cc4ff; }
  #notes table { border-collapse: collapse; width: 100%; }
  #notes td { border-top: 1px solid rgba(255,255,255,.1); padding: 2px 4px; vertical-align: top; }
  #notes code { color: #ffd27a; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
    "three/src/": "https://cdn.jsdelivr.net/npm/three@0.187.0/src/"
  }
}
</script>
</head>
<body>
<script type="module">
  // the review lab (2026-11-12) by default; ?old=1 = the first lab (gallery, sliders, city sample)
  if (new URLSearchParams(location.search).get("old") === "1") {
    document.body.insertAdjacentHTML("beforeend", `<div id="title"><b>Material Lab (old)</b> · <a href="?">new review lab</a> · <a href="./">all labs</a> · <a href="../docs/MATERIALS.md">docs</a></div>
      <div id="split"><span style="left:0">A · procedural</span><span style="left:33.3%">B · scan (CC0)</span><span style="left:66.6%">C · scan (was hybrid)</span></div>
      <div id="notes"></div><div id="info">loading…</div>`);
    document.body.style.background = "#8e9aa6";
    import("./material-lab.js");
  } else import("./material-review.js");
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Lab</title>
<link rel="icon" href="../viewer/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8e9aa6; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; }
  #info { position: fixed; left: 10px; bottom: 10px; max-width: 520px; padding: 8px 10px; border-radius: 6px;
          background: rgba(20, 24, 30, .78); color: #dfe4ea; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
  #title { position: fixed; left: 10px; top: 10px; padding: 6px 10px; border-radius: 6px; background: rgba(20, 24, 30, .78);
           color: #e6e9ee; }
  #title a { color: #9cc4ff; }
  #speedo { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 14px; border-radius: 8px;
            background: rgba(20, 24, 30, .7); color: #fff; font: 600 22px/1 ui-monospace, monospace; }
  #speedo small { font-size: 12px; color: #b8c2cc; font-weight: 400; }
  .lbl { position: fixed; transform: translate(-50%, -100%); padding: 3px 7px; border-radius: 5px; background: rgba(20, 24, 30, .72);
         color: #e6e9ee; font: 11px/1.3 ui-monospace, monospace; white-space: pre; text-align: center; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
    "three/src/": "https://cdn.jsdelivr.net/npm/three@0.187.0/src/",
    "meshoptimizer/simplifier": "https://cdn.jsdelivr.net/npm/meshoptimizer@1.2.0/meshopt_simplifier.js"
  }
}
</script>
</head>
<body>
<div id="title"><b>Car Lab</b> — the driving model · <a href="?mode=compare">compare the car models</a> · <a href="?mode=street">street of 300</a> · <a href="./">all labs</a> · <a href="../viewer/index.html?view=drive">drive it in the city</a></div>
<div id="speedo">0 <small>km/h</small></div>
<div id="info">loading…</div>
<script type="module">
  // ?mode=compare | street: the car-model comparison (car-compare.js); else the driving lab (car-lab.js, ?car=<spec>)
  const mode = new URLSearchParams(location.search).get("mode");
  import(mode === "compare" || mode === "street" ? "./car-compare.js" : "./car-lab.js");
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike Lab</title>
<link rel="icon" href="../viewer/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9bccd; font: 13px/1.4 system-ui, sans-serif; }
  canvas#view { display: block; }
  #title { position: fixed; left: 10px; top: 10px; padding: 6px 10px; border-radius: 6px; background: rgba(20, 24, 30, .78); color: #e6e9ee; }
  #title b { color: #f2c12e; }
  #title small { color: #aab4bf; }
  #tele { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center;
          padding: 8px 12px; border-radius: 8px; background: rgba(20, 24, 30, .82); color: #e6e9ee; font: 12px/1.3 ui-monospace, Consolas, monospace;
          white-space: nowrap; max-width: calc(100vw - 380px); }
  #tele .big { font: 700 24px/1 ui-monospace, Consolas, monospace; color: #fff; min-width: 70px; text-align: right; }
  #tele .big small { font-size: 11px; color: #aab4bf; font-weight: 400; }
  #tele .col { display: grid; gap: 2px; }
  #tele .k { color: #8f9ba7; }
  #tele .warn { color: #ff8a65; } #tele .ok { color: #8fd694; } #tele .hot { color: #f2c12e; }
  #tele canvas { background: rgba(255,255,255,.04); border-radius: 4px; }
  .wheel { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #444; margin-right: 2px; vertical-align: -1px; }
  .wheel.on { background: #8fd694; }
  .bar { display: inline-block; width: 36px; height: 6px; background: #333; border-radius: 3px; vertical-align: 1px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #78aefc; }
  #card { position: fixed; left: 10px; top: 46px; max-width: 360px; padding: 10px 12px; border-radius: 8px; background: rgba(20, 24, 30, .86);
          color: #dfe4ea; font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre; }
  #card.hidden { display: none; }
  #banner { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font: 700 22px/1.2 system-ui, sans-serif; color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .25s; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title"><b>Bike Lab</b> <small>the kid's BMX, feel rounds 1-4 · docs/BIKE.md · ? controls</small></div>
<div id="card"></div>
<div id="banner"></div>
<div id="tele">loading…</div>
<script type="module" src="./bikeLab.js"></script>
</body>
</html>
